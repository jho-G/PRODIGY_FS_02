name: CI — Employee Management System

on:
  push:
    branches: [main, react_and_drf, develop]
  pull_request:
    branches: [main, react_and_drf]

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # Backend: Lint + Unit + Integration Tests
  # ============================================================
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-use-at-all
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: ""  # use SQLite for CI
      REDIS_URL: "redis://localhost:6379/1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt coverage ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Run tests with coverage
        run: |
          coverage run --source=employees manage.py test employees --verbosity=2
          coverage report --fail-under=75
          coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================================
  # Backend: Security Audit
  # ============================================================
  backend-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-use-at-all
      DEBUG: "False"
      ALLOWED_HOSTS: "example.com"
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django deployment security check
        # We expect some warnings since this is not a real deployment,
        # but we should have no critical ERRORS. Exit 1 only on errors.
        run: |
          python manage.py check --deploy 2>&1 | tee deploy-check.txt
          # Fail if any ERROR-level issues are reported
          if grep -q "^ERRORS:" deploy-check.txt; then
            echo "Security check found critical errors!"
            exit 1
          fi
          echo "No critical security errors found."

  # ============================================================
  # Frontend: Lint + Build
  # ============================================================
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run oxlint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Verify build output
        working-directory: frontend
        run: |
          ls -la dist/
          test -f dist/index.html || (echo "Build failed — index.html missing" && exit 1)

  # ============================================================
  # Docker: Build Validation
  # ============================================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ems-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ems-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # All-Green Gate: Required for merge
  # ============================================================
  ci-gate:
    name: CI Gate (All Jobs Pass)
    runs-on: ubuntu-latest
    needs: [backend-test, backend-security, frontend-build, docker-build]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.backend-security.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed! ✅"
