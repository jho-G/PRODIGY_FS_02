# ==========================================================
# 1. HTTP Server: Redirect all insecure HTTP traffic to HTTPS
# ==========================================================
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Permanent 301 redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================
# 2. HTTPS Server: SSL Termination, Static React & Reverse Proxy
# ==========================================================
server {
    listen 443 ssl;
    server_name localhost;

    # If a plain HTTP request hits the HTTPS port (e.g. http://localhost:5173),
    # nginx raises error 497 — redirect to HTTPS instead of returning 400 Bad Request
    error_page 497 =301 https://$host$request_uri;

    # SSL Certificate Paths (mounted from host into container)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Secure SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Hide Nginx version from response headers and error pages
    server_tokens off;

    # HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Allow request body up to 15MB for employee document uploads
    client_max_body_size 15M;

    # Gzip Compression for fast delivery of SPA assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Serve built React Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Essential for React Router (redirects all deep links to index.html)
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy: Forward all /api/ requests to Gunicorn on the backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # Reverse Proxy: Forward all /admin/ requests to Django admin on the backend container
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # Reverse Proxy: Forward /static/ requests to backend (served by WhiteNoise)
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Serve user-uploaded media files directly from shared volume with strict security controls
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        autoindex off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;

        # Prevent execution or direct serving of dangerous scripts in media
        location ~* \.(php|pl|py|jsp|asp|sh|cgi|exe|bat|cmd)$ {
            deny all;
        }
    }

    # Health Check: Forward liveness probe to backend
    location /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
