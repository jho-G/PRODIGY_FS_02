# Ruff configuration for Employee Management System
# https://docs.astral.sh/ruff/configuration/

# Target Python version (matches Dockerfile)
target-version = "py311"

# Files and directories to exclude from linting
exclude = [
    ".git",
    ".github",
    "venv",
    "env",
    "ENV",
    "__pycache__",
    "*.pyc",
    "migrations",       # Auto-generated by Django — skip style checks
    "manage.py",        # Django boilerplate
]

# Max line length (88 matches Black's default)
line-length = 88

[lint]
# Rule set: E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade,
#           B = flake8-bugbear, SIM = flake8-simplify, DJ = flake8-django
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DJ"]

ignore = [
    # Allow long lines in migration files (excluded above, but just in case)
    "E501",
    # Allow `assert` in tests
    "S101",
    # Allow Django's CharField/TextField without explicit max_length in some cases
    "DJ001",
    # Allow f-strings in logging (common in Django)
    "G004",
    # Django model method ordering — existing codebase uses a different convention
    "DJ012",
    # zip() without strict= — existing code intentionally zips equal-length sequences
    "B905",
    # Nested if → and — existing logic is intentionally split for readability
    "SIM102",
]

# Allow unused imports in __init__.py (common Django pattern)
[lint.per-file-ignores]
"__init__.py" = ["F401"]
"employees/tests.py" = ["E501"]   # Long test lines are fine

[lint.isort]
known-first-party = ["employees", "employee_system"]
known-third-party = ["rest_framework", "rest_framework_simplejwt", "corsheaders", "decouple", "django_ratelimit"]

[format]
# Use double quotes (Django project convention)
quote-style = "double"
indent-style = "space"
