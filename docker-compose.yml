services:
  # ============================================================
  # Django REST Framework Backend Service
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database file between container restarts
      # In production, replace with a PostgreSQL service volume
      - ./db.sqlite3:/app/db.sqlite3
      # Persist user-uploaded documents
      - ./media:/app/media
    env_file:
      # Load all settings from .env — create this from .env.example
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/token/verify/", "-X", "POST", "-d", "{}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ems_network

  # ============================================================
  # React + Nginx Frontend Service
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5173:443"
    volumes:
      # Mount SSL certificate and private key securely into Nginx
      - ./frontend/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ems_network

networks:
  ems_network:
    driver: bridge
