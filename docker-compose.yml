services:
  # ==========================================
  # Django REST Framework Backend Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database file between container restarts
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ems_network

  # ==========================================
  # React + Nginx Frontend Service
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ems_network

networks:
  ems_network:
    driver: bridge
