services:
  # ============================================================
  # PostgreSQL Database Service (Production)
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: ems_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems_db}
      POSTGRES_USER: ${POSTGRES_USER:-ems_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems_user} -d ${POSTGRES_DB:-ems_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems_network

  # ============================================================
  # Redis Distributed Cache Service (Phase 4.1 Rate Limiting)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ems_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - ems_network

  # ============================================================
  # Django REST Framework Backend Service
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems_backend
    restart: unless-stopped
    ports:
      # Bind backend only to loopback interface to prevent bypassing Nginx SSL & rate limits
      - "127.0.0.1:8000:8000"
    volumes:
      # Persist SQLite fallback database file between container restarts
      - ./db.sqlite3:/app/db.sqlite3
      # Persist user-uploaded documents
      - ./media:/app/media
    env_file:
      # Load all settings from .env — create this from .env.example
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
    healthcheck:
      # Use the dedicated /health/ endpoint — fast, no DB query
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ems_network

  # ============================================================
  # React + Nginx Frontend Service
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount SSL certificate and private key securely into Nginx
      - ./frontend/ssl:/etc/nginx/ssl:ro
      # Mount user uploads directory so Nginx can serve files directly
      - ./media:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ems_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ems_network:
    driver: bridge

